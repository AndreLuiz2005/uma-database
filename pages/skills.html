
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Uma Database | Skills</title>

    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="../css/style.css">
</head>
<body>

    <header>
        <nav class="navbar navbar-expand-lg navbar-dark bg-dark">
            <div class="container">
                <a class="navbar-brand" href="../index.html">Uma Database</a>

                <button class="navbar-toggler" type="button"
                    data-bs-toggle="collapse" data-bs-target="#navbarNav">
                    <span class="navbar-toggler-icon"></span>
                </button>

                <div class="collapse navbar-collapse" id="navbarNav">
                    <ul class="navbar-nav ms-auto">
                        <li class="nav-item">
                            <a class="nav-link" href="../index.html">Home</a>
                        </li>
                        <li class="nav-item">
                            <a class="nav-link" href="characters.html">Characters</a>
                        </li>
                        <li class="nav-item">
                            <a class="nav-link" href="support-cards.html">Support Cards</a>
                        </li>
                        <li class="nav-item">
                            <a class="nav-link active" href="skills.html">Skills</a>
                        </li>
                        <li class="nav-item">
                            <a class="nav-link" href="news.html">News</a>
                        </li>
                    </ul>
                </div>
            </div>
        </nav>
    </header>

    <main class="container py-4">
        <section>
            <h1 class="mb-2">Skills Library</h1>
            <p class="text-muted">
                Browse skills available in the Japanese version of Uma Musume.
            </p>

            <form id="formBuscaSkills" class="mb-4">
                <div class="input-group">
                    <input
                        type="search"
                        id="campoBuscaSkills"
                        class="form-control"
                        placeholder="Search skills by name or ID..."
                    >
                    <button class="btn btn-primary" type="submit"
                        id="botaoBuscaSkills">
                        Search
                    </button>
                </div>
            </form>

            <div id="carregamentoSkills" class="text-center py-4">
                <div class="spinner-border text-primary" role="status"></div>
                <p class="mt-2">Loading skills...</p>
            </div>

            <div id="mensagemSkills" class="alert d-none" role="alert"></div>

            <div id="listaSkills" class="row g-3"></div>
        </section>
    </main>

    <footer class="bg-dark text-light text-center py-3 mt-5">
        <p class="mb-0">Uma Database</p>
    </footer>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
    <script src="../js/skills.js"></script>
</body>
</html>
