<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Support Cards | Uma Database</title>

    <link
        href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"
        rel="stylesheet"
    >

    <link rel="stylesheet" href="../css/style.css">
</head>

<body>

    <header>
        <nav class="navbar navbar-expand-lg navbar-dark">
            <div class="container">
                <a class="navbar-brand fw-bold" href="../index.html">
                    Uma Database
                </a>

                <button
                    class="navbar-toggler"
                    type="button"
                    data-bs-toggle="collapse"
                    data-bs-target="#menuPrincipal"
                    aria-controls="menuPrincipal"
                    aria-expanded="false"
                    aria-label="Abrir menu"
                >
                    <span class="navbar-toggler-icon"></span>
                </button>

                <div class="collapse navbar-collapse" id="menuPrincipal">
                    <ul class="navbar-nav ms-auto">
                        <li class="nav-item">
                            <a class="nav-link" href="../index.html">Home</a>
                        </li>
                        <li class="nav-item">
                            <a class="nav-link" href="characters.html">Characters</a>
                        </li>
                        <li class="nav-item">
                            <a class="nav-link active" href="support-cards.html">
                                Support Cards
                            </a>
                        </li>
                        <li class="nav-item">
                            <a class="nav-link" href="skills.html">Skills</a>
                        </li>
                        <li class="nav-item">
                            <a class="nav-link" href="news.html">News</a>
                        </li>
                    </ul>
                </div>
            </div>
        </nav>
    </header>

    <main class="container py-5">

        <section class="mb-4">
            <h1 class="fw-bold">Support Cards</h1>
            <p class="text-secondary">
                Explore as cartas de suporte de Uma Musume.
            </p>
        </section>

        <section class="mb-4">
            <form id="formBusca" class="row g-2">
                <div class="col-12 col-md-9">
                    <input
                        type="search"
                        id="campoBusca"
                        class="form-control"
                        placeholder="Pesquisar pelo título ou ID..."
                        aria-label="Pesquisar Support Cards"
                    >
                </div>

                <div class="col-12 col-md-3">
                    <button
                        type="submit"
                        id="botaoBusca"
                        class="btn btn-primary w-100"
                    >
                        Pesquisar
                    </button>
                </div>
            </form>
        </section>

        <div id="mensagem" role="status" aria-live="polite"></div>

        <div id="carregamento" class="text-center py-5">
            <div class="spinner-border text-primary" role="status">
                <span class="visually-hidden">Carregando...</span>
            </div>
            <p class="mt-2">Carregando Support Cards... (isso pode demorar um pouco)</p>
        </div>

        <section>
            <div id="listaSupportCards" class="row g-4"></div>
        </section>

    </main>

    <footer class="bg-dark text-white text-center py-3">
        <p class="mb-0">Uma Database | Projeto acadêmico</p>
    </footer>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
    <script src="../js/api.js"></script>
    <script src="../js/support-cards.js"></script>

</body>
</html>
