
<!DOCTYPE html>
<html lang="pt-BR">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>News | Uma Database</title>

    <link
        href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"
        rel="stylesheet"
    >

    <link rel="stylesheet" href="../css/style.css">
</head>

<body>

    <header>
        <nav class="navbar navbar-expand-lg navbar-dark bg-dark">
            <div class="container">

                <a class="navbar-brand" href="../index.html">
                    Uma Database
                </a>

                <button
                    class="navbar-toggler"
                    type="button"
                    data-bs-toggle="collapse"
                    data-bs-target="#menu"
                    aria-controls="menu"
                    aria-expanded="false"
                    aria-label="Abrir menu"
                >
                    <span class="navbar-toggler-icon"></span>
                </button>

                <div class="collapse navbar-collapse" id="menu">
                    <ul class="navbar-nav ms-auto">

                        <li class="nav-item">
                            <a class="nav-link" href="../index.html">Início</a>
                        </li>

                        <li class="nav-item">
                            <a class="nav-link" href="characters.html">Characters</a>
                        </li>

                        <li class="nav-item">
                            <a class="nav-link" href="support-cards.html">Support Cards</a>
                        </li>

                        <li class="nav-item">
                            <a class="nav-link" href="skills.html">Skills</a>
                        </li>

                        <li class="nav-item">
                            <a class="nav-link active" href="news.html">News</a>
                        </li>

                    </ul>
                </div>

            </div>
        </nav>
    </header>

    <main class="container py-4">

        <section class="mb-4">
            <h1 class="mb-2">Uma Musume News</h1>

            <p class="text-secondary">
                Confira as notícias e novidades de Uma Musume.
            </p>
        </section>

        <section class="mb-4">

            <form id="formBuscaNews" class="row g-2">

                <div class="col-12 col-md-9">
                    <input
                        type="search"
                        id="campoBuscaNews"
                        class="form-control"
                        placeholder="Pesquisar notícias..."
                        aria-label="Pesquisar notícias"
                    >
                </div>

                <div class="col-12 col-md-3">
                    <button
                        type="submit"
                        id="botaoBuscaNews"
                        class="btn btn-primary w-100"
                    >
                        Pesquisar
                    </button>
                </div>

            </form>

        </section>

        <section>

            <div
                id="carregamentoNews"
                class="text-center py-4"
                role="status"
            >
                <div class="spinner-border text-primary" aria-hidden="true"></div>

                <p class="mt-2">
                    Carregando notícias...
                </p>
            </div>

            <div id="mensagemNews"></div>

            <div
                id="listaNews"
                class="row g-4"
            ></div>

        </section>

    </main>

    <footer class="bg-dark text-light text-center py-3 mt-5">
        <p class="mb-1">Uma Database</p>
        <small>
            Dados fornecidos por
            <a
                href="https://umapyoi.net"
                target="_blank"
                rel="noopener noreferrer"
                class="text-light"
            >
                Umapyoi.net
            </a>
        </small>
    </footer>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>

    <script src="../js/api.js"></script>
    <script src="../js/news.js"></script>

</body>
</html>
